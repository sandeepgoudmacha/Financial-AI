[project]
name = "valura-ai"
version = "1.0.0"
description = "Production-grade multi-agent financial intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Valura AI Team"}
]

dependencies = [
    # --- API & Server ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    
    # --- LLM ---
    "openai>=1.40.0",
    "groq>=0.9.0",
    
    # --- Orchestration ---
    "crewai>=0.100.0",
    "litellm>=1.83.0",
    
    # --- Data & Finance ---
    "yfinance>=0.2.40",
    "duckduckgo-search>=6.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    
    # --- Visualization ---
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
    
    # --- Data Validation ---
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    
    # --- Database ---
    "aiosqlite>=0.20.0",
    
    # --- Frontend ---
    "streamlit>=1.37.0",
    
    # --- Utilities ---
    "python-dotenv>=1.0.0",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "unit: Unit tests (no external deps)",
    "integration: Integration tests (may need API keys)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
